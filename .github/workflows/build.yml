name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  quality:
    name: Quality Gates
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-release-windows-py312.txt

      - name: Install locked release environment
        run: python -m pip install -r requirements-release-windows-py312.txt

      - name: Validate dependency graph
        run: python -m pip check

      - name: Audit locked dependency inventory
        run: python scripts/validate_release_dependencies.py --verify-installed

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run unified offline regression
        run: python scripts/validate_multi_material_regression.py

      - name: Compile Python sources
        run: >-
          python -m compileall -q core gui utils scripts tests main.py app_updater.py

      - name: Validate release metadata
        run: python scripts/validate_release_readiness.py

  windows-build:
    name: Windows Build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: quality
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-release-windows-py312.txt

      - name: Install locked release environment
        run: python -m pip install -r requirements-release-windows-py312.txt

      - name: Set reproducible build time
        shell: pwsh
        run: |
          $epoch = git show -s --format=%ct HEAD
          if ($epoch -notmatch '^\d+$') {
            throw "Unable to resolve SOURCE_DATE_EPOCH from the checked-out commit."
          }
          "SOURCE_DATE_EPOCH=$epoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build package
        shell: pwsh
        run: |
          $buildArgs = @()
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $buildArgs += "--tag=$env:GITHUB_REF_NAME"
          }
          & .\build.bat @buildArgs
          if ($LASTEXITCODE -ne 0) {
            throw "build.bat failed with exit code $LASTEXITCODE."
          }

      - name: Validate packaged release
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath release -Filter *.zip)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one release archive, found $($archives.Count)."
          }
          python scripts/validate_release_artifact.py --archive $archives[0].FullName --run-health-check
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged release validation failed."
          }

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $changelog = "CHANGELOG.md"
          if (-not (Test-Path -LiteralPath $changelog)) {
            throw "CHANGELOG.md is required for tag releases."
          }

          $lines = Get-Content -LiteralPath $changelog -Encoding UTF8
          $escapedTag = [regex]::Escape($tag)
          $start = $null

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+\[?$escapedTag\]?(\s|$)") {
              $start = $i
              break
            }
          }

          if ($null -eq $start) {
            throw "No CHANGELOG.md section found for $tag."
          }

          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+") {
              $end = $i
              break
            }
          }

          $section = New-Object System.Collections.Generic.List[string]
          for ($i = $start + 1; $i -lt $end; $i++) {
            $section.Add($lines[$i])
          }

          $body = ($section -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) {
            throw "CHANGELOG.md section for $tag is empty."
          }

          Set-Content -LiteralPath release_notes.md -Value $body -Encoding UTF8

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: charapicker-windows-build
          path: |
            release/*.zip
            release/*.sha256
            release/build-info.json
            release/dependency-inventory.json
            release_notes.md
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: charapicker-windows-build
          path: release-assets

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          files: |
            release-assets/release/*.zip
            release-assets/release/*.sha256
            release-assets/release/build-info.json
            release-assets/release/dependency-inventory.json
          body_path: release-assets/release_notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
